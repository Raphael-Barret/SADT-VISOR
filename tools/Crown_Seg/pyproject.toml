[project]
name = "sadt-crownseg"
version = "0.1.0"
description = "Label every tooth of an intraoral scan with its dental number."
# The deployment image's interpreter (lab-ai:2026.08, python 3.11.13). It used
# to be the only one pytorch3d was built for; nothing here needs that any more,
# and it is kept so the lock and the image do not move with this change.
requires-python = ">=3.11,<3.12"
# Everything the tool needs EXCEPT the segmentation engine's two extra packages.
# Kept apart on purpose -- see the extra below and README.md.
dependencies = [
    # Pinned: an unpinned torch is not reproducible, and the same `uv sync` two
    # months apart gives two different runtimes. It used to be pinned for a
    # second reason, the pytorch3d wheel tag (`+pt2110cu128`) that named one
    # torch version exactly; nothing here links against torch's ABI any more,
    # so the pin is now only about reproducibility.
    "torch==2.11.0",
    "vtk==9.6.2",
    "numpy==2.3.2",
    # Not used directly: torch pulls it in. From 3.30 it installs a process-wide
    # audit hook that raises on an os.fork while another thread is mid-fork with
    # a lock held ("os.fork is unsafe while filelock is changing descriptor
    # ownership"), which lost a structure in one AMASSS run in two. 3.29 has none.
    "filelock<3.30",
]

# What makes this directory a tool. A directory holding a pyproject.toml
# WITHOUT this section -- a shared path dependency, the testkit -- is a plain
# package: importable, installable, never discovered or served.
#
# `name` is the API identity: what a client sends, what deployment.toml is keyed
# by, and what another tool passes to `sup.run()`. Declared rather than derived
# from the directory so a folder can be reorganised without breaking the HTTP
# contract -- moving ALI_CBCT under a grouping folder is exactly that case.
[tool.sadt]
tool = true
name = "Crown_Seg"

# The engine. It is shapeaxi's `dentalmodelseg` carried over to torch, monai,
# VTK and Embree, so nothing here needs shapeaxi, pytorch3d, torchvision,
# lightning, ocnn, SimpleITK or open3d, and none of them is installed. It stays
# an extra so a plain `uv sync` can still import the package and publish its
# schema without the engine; `uv sync --extra segmentation` builds the real
# thing, and it is two small packages, not a GPU stack.
[project.optional-dependencies]
segmentation = [
    # The 2D U-Net's library. The same version ALI_IOS pins, for the same
    # network family.
    "monai==1.6.0",
    # The ray caster behind `render_native.py`, which replaces pytorch3d's
    # rasterizer. Pinned to the version the macOS recipe installs for the other
    # IOS tools.
    "embreex==4.4.0.post1",
]

[dependency-groups]
dev = ["pytest==8.3.4", "sadt-testkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sadt_crownseg"]

# `explicit` is load-bearing: without it uv looks for EVERY package on the
# PyTorch index, and most of them are not there. It is also what keeps torch on
# the one CUDA variant the deployment image carries.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Development only: lets this tool's tests run ANOTHER tool through that tool's
# own venv, as a subprocess, the way the server does. It has no dependencies of
# its own, so it cannot perturb the resolution above. Never move it into
# [project] dependencies -- see testkit/README.md.
sadt-testkit = { path = "../../testkit", editable = true }
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselected by DEFAULT, not merely skipped: a plain `pytest` must not depend on
# a card, on the `segmentation` extra, or on a 16 MB mesh being staged -- and a
# suite whose green line is half skips says nothing. Run them by hand with
# `-m models -o addopts=` and report the result in the PR.
addopts = "-m 'not gpu and not models'"
markers = [
    "gpu: needs a CUDA device. Deselected by default; run it by hand and report the result in the PR.",
    "models: needs the real checkpoint and mesh, named by SADT_CROWNSEG_MODEL and SADT_CROWNSEG_MESH, and the `segmentation` extra. Deselected by default. See tests/data/README.md.",
]
